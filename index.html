<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>OBS Live Football Score Banner</title>
<style>
  html, body { margin:0; padding:0; font-family:sans-serif; height:100%; }
  body { display:flex; justify-content:flex-start; align-items:flex-start; padding-top:10px; }

  .container {
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:95%;
    max-height:350px;
    border-radius:10px;
    overflow:hidden;
    font-weight:bold;
    color:white;
    font-size:2em;
    padding:0.5em;
    box-sizing:border-box;
  }

  .team {
    display:flex;
    align-items:center;
    gap:0.7em;
    padding:0.5em;
    border-radius:10px;
  }

  .team img { max-height:100px; max-width:100px; }
  .team-name { min-width:140px; text-align:center; }
  .team-score { font-size:3em; -webkit-text-stroke: 2px black; text-align:center; }

  /* Editor */
  #editor {
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1em;
  }

  input, button { font-size:1em; padding:0.3em; margin:0.2em; }
</style>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
</head>
<body>

<!-- OBS Banner -->
<div id="obs" style="display:none;">
  <div class="container" id="scoreContainer">
    <div class="team" id="team1">
      <img id="team1Logo" src="">
      <div class="team-name" id="team1Name"></div>
      <div class="team-score" id="team1Score"></div>
    </div>
    <div style="width:100px;"></div>
    <div class="team" id="team2">
      <div class="team-score" id="team2Score"></div>
      <div class="team-name" id="team2Name"></div>
      <img id="team2Logo" src="">
    </div>
  </div>
</div>

<!-- Editor -->
<div id="editor">
  <h2>Live Score Editor</h2>
  <div>
    <h3>Team 1</h3>
    <input id="team1NameInput" placeholder="Team 1 Naam">
    <input id="team1LogoInput" placeholder="Team 1 Logo URL">
    <input type="number" id="team1ScoreInput" placeholder="Score" min="0">
    <input type="color" id="team1ColorInput" value="#1E90FF">
  </div>
  <div>
    <h3>Team 2</h3>
    <input id="team2NameInput" placeholder="Team 2 Naam">
    <input id="team2LogoInput" placeholder="Team 2 Logo URL">
    <input type="number" id="team2ScoreInput" placeholder="Score" min="0">
    <input type="color" id="team2ColorInput" value="#FF0000">
  </div>
  <button id="updateBtn">Update Score</button>
  <p>OBS link: <span id="obsLink"></span></p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const mode = params.get('mode') || 'editor';

const firebaseConfig = {
  apiKey: "AIzaSyASMzmFDtKrGm0Ff4Tu2vBAOty3usTstrU",
  authDomain: "soccer-banner-2d394.firebaseapp.com",
  databaseURL: "https://soccer-banner-2d394-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "soccer-banner-2d394",
  storageBucket: "soccer-banner-2d394.firebasestorage.app",
  messagingSenderId: "836525547963",
  appId: "1:836525547963:web:2ab97e7731d339d36a249e",
  measurementId: "G-32J6V0FSNS"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const path = 'footballScore';

// OBS mode (public)
if(mode === 'obs'){
  document.getElementById('obs').style.display='flex';

  const t1Name = document.getElementById('team1Name');
  const t1Logo = document.getElementById('team1Logo');
  const t1Score = document.getElementById('team1Score');
  const t1Div = document.getElementById('team1');

  const t2Name = document.getElementById('team2Name');
  const t2Logo = document.getElementById('team2Logo');
  const t2Score = document.getElementById('team2Score');
  const t2Div = document.getElementById('team2');

  const ref = db.ref(path);

  ref.on('value', snapshot=>{
    const data = snapshot.val() || {
      team1:{name:'Team 1', logo:'', score:0, color:'#1E90FF'},
      team2:{name:'Team 2', logo:'', score:0, color:'#FF0000'}
    };
    t1Name.textContent = data.team1.name;
    t1Logo.src = data.team1.logo;
    t1Score.textContent = data.team1.score;
    t1Div.style.backgroundColor = data.team1.color;

    t2Name.textContent = data.team2.name;
    t2Logo.src = data.team2.logo;
    t2Score.textContent = data.team2.score;
    t2Div.style.backgroundColor = data.team2.color;

    localStorage.setItem(`banner_${path}`, JSON.stringify(data));
  });

} else {
  // Editor mode: password check
  const PASSWORD = "arsenal"; // 🔑 set your password here
  let storedPass = localStorage.getItem('editorPass');

  function askPassword(){
    let pass = prompt("Enter password to access the editor:");
    if(pass === PASSWORD){
      localStorage.setItem('editorPass', pass);
      document.getElementById('editor').style.display='flex';
      setupEditor();
    } else {
      alert("Wrong password! Try again.");
      askPassword();
    }
  }

  if(storedPass === PASSWORD){
    document.getElementById('editor').style.display='flex';
    setupEditor();
  } else {
    askPassword();
  }
}

// Function to initialize editor functionality
function setupEditor(){
  const t1Name = document.getElementById('team1NameInput');
  const t1Logo = document.getElementById('team1LogoInput');
  const t1Score = document.getElementById('team1ScoreInput');
  const t1Color = document.getElementById('team1ColorInput');

  const t2Name = document.getElementById('team2NameInput');
  const t2Logo = document.getElementById('team2LogoInput');
  const t2Score = document.getElementById('team2ScoreInput');
  const t2Color = document.getElementById('team2ColorInput');

  const obsLink = document.getElementById('obsLink');
  const url = `${window.location.origin}${window.location.pathname}?mode=obs`;
  obsLink.innerHTML = `<a href="${url}" target="_blank">${url}</a>`;

  db.ref(path).once('value').then(snapshot=>{
    const data = snapshot.val();
    if(data){
      t1Name.value = data.team1.name;
      t1Logo.value = data.team1.logo;
      t1Score.value = data.team1.score;
      t1Color.value = data.team1.color;

      t2Name.value = data.team2.name;
      t2Logo.value = data.team2.logo;
      t2Score.value = data.team2.score;
      t2Color.value = data.team2.color;
    } else {
      const localData = localStorage.getItem(`banner_${path}`);
      if(localData){
        const data = JSON.parse(localData);
        t1Name.value = data.team1.name;
        t1Logo.value = data.team1.logo;
        t1Score.value = data.team1.score;
        t1Color.value = data.team1.color;

        t2Name.value = data.team2.name;
        t2Logo.value = data.team2.logo;
        t2Score.value = data.team2.score;
        t2Color.value = data.team2.color;
      }
    }
  });

  function saveData(){
    const data = {
      team1:{name:t1Name.value, logo:t1Logo.value, score:Number(t1Score.value), color:t1Color.value},
      team2:{name:t2Name.value, logo:t2Logo.value, score:Number(t2Score.value), color:t2Color.value}
    };
    db.ref(path).set(data);
    localStorage.setItem(`banner_${path}`, JSON.stringify(data));
  }

  const inputs = [t1Name,t1Logo,t1Score,t1Color,t2Name,t2Logo,t2Score,t2Color];
  inputs.forEach(input=>{
    input.addEventListener('blur', saveData);
    input.addEventListener('keydown', e=>{
      if(e.key === 'Enter') saveData();
    });
    input.addEventListener('input', saveData);
  });

  document.getElementById('updateBtn').addEventListener('click', saveData);
}
</script>
</body>
</html>
